<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalendarDate - Vanilla Example</title>
  <link rel="stylesheet" href="../dist/dualcal.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CalendarDate - Vanilla Example</h1>
    <p class="description">
      Gregorian calendar widget with holidays and events
    </p>
    <div id="calendar"></div>
  </div>

  <script type="module">
    import { createDualCalendar } from '../src/index.ts';

    console.log('Script loaded, dualcal imported:', typeof createDualCalendar);

    const container = document.getElementById('calendar');
    console.log('Container found:', container);

    try {
      // Load holidays from JSON file
      const holidaysResponse = await fetch('holidays.json');
      const holidaysData = await holidaysResponse.json();
      console.log('Holidays loaded:', holidaysData);

      const calendar = createDualCalendar(container, {
        holidays: holidaysData.holidays,
        weekendDays: [0, 6], // Saturday and Sunday
        initialDate: new Date(),
        locale: 'en', // Available: 'en', 'fr', 'de'
        onDayClick: (date) => {
          console.log('Day clicked:', date);
        },
        onMonthChange: (grid) => {
          console.log('Month changed:', grid);
        },
        theme: {
          // Custom theme colors (optional)
          headerColor: '#B34000',
          holidayBg: '#FFF0F0',
          holidayColor: '#D0021B',
        },
      });

      console.log('Calendar created:', calendar);
      // Expose for debugging
      window.calendar = calendar;
    } catch (error) {
      console.error('Error creating calendar:', error);
      container.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
    }
  </script>
</body>
</html>
