<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalendarDate - Demo</title>
  <link rel="stylesheet" href="dist/dualcal.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .locale-selector {
      text-align: center;
      margin-bottom: 20px;
    }

    .locale-selector select {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CalendarDate - Demo</h1>
    <p class="description">
      Gregorian calendar widget with holidays and events
    </p>
    <div class="locale-selector">
      <select id="localeSelect">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
    <div id="calendar"></div>
  </div>

  <script type="module">
    import { createDualCalendar } from './dist/index.mjs';

    console.log('Script loaded, dualcal imported:', typeof createDualCalendar);

    const container = document.getElementById('calendar');
    const localeSelect = document.getElementById('localeSelect');
    let calendarInstance = null;

    async function loadCalendar(locale) {
      // Destroy existing calendar
      if (calendarInstance) {
        calendarInstance.destroy();
      }

      try {
        // Load holidays from JSON file
        const holidaysResponse = await fetch('examples/holidays.json');
        const holidaysData = await holidaysResponse.json();
        console.log('Holidays loaded:', holidaysData);

        calendarInstance = createDualCalendar(container, {
          holidays: holidaysData.holidays,
          weekendDays: [5], // Friday (5 = Friday in JS Date)
          initialDate: new Date(),
          locale: locale,
          onDayClick: (date) => {
            console.log('Day clicked:', date);
          },
          onMonthChange: (grid) => {
            console.log('Month changed:', grid);
          },
          theme: {
            // Custom theme colors (optional)
            headerColor: '#B34000',
            holidayBg: '#FFF0F0',
            holidayColor: '#D0021B',
          },
        });

        console.log('Calendar created with locale:', locale);
        window.calendar = calendarInstance;
      } catch (error) {
        console.error('Error creating calendar:', error);
        container.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    }

    // Load calendar with initial locale
    loadCalendar('en');

    // Reload calendar when locale changes
    localeSelect.addEventListener('change', (e) => {
      loadCalendar(e.target.value);
    });
  </script>
</body>
</html>
